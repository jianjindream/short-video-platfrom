server:
  port: 8008
spring:
  application:
    name: short-video-platfrom-gateway
  redis:
    host: redis
    port: 6379
    database: 0
    timeout: 3000
  cloud:
    gateway:
      routes:
        - id: short-video-platfrom-user
          uri: lb://short-video-platfrom-user
          predicates:
            - Path=/douyin/user/**
        - id: short-video-platfrom-comment
          uri: lb://short-video-platfrom-comment
          predicates:
            - Path=/douyin/comment/**
        - id: short-video-platfrom-favorite
          uri: lb://short-video-platfrom-favorite
          predicates:
            - Path=/douyin/favorite/action
        - id: short-video-platfrom-relation
          uri: lb://short-video-platfrom-relation
          predicates:
            - Path=/douyin/relation/**
        - id: short-video-platfrom-video
          uri: lb://short-video-platfrom-video
          predicates:
            - Path=/douyin/feed,/douyin/favorite/**,/douyin/publish/**
    nacos:
      discovery:
        server-addr: nacos:8848
        service: ${spring.application.name}

jwt:
  issuer: short-video-platfrom
  signed: U2hvcnRWaWRlb1BsYXRmcm9tCg==

gateway:
  auth:
    enabled: true
    public-paths:
      - /douyin/user/login
      - /douyin/user/register
      - /douyin/user/token/refresh
      - /douyin/feed
  rate-limit:
    enabled: true
    key-prefix: short-video-platfrom:gateway:rate-limit
    rules:
      - id: user-login
        path: /douyin/user/login
        methods: [POST]
        key-by: IP
        limit: 5
        window-seconds: 60
      - id: user-register
        path: /douyin/user/register
        methods: [POST]
        key-by: IP
        limit: 3
        window-seconds: 60
      - id: favorite-action
        path: /douyin/favorite/action
        methods: [POST]
        key-by: USER
        limit: 30
        window-seconds: 10
      - id: comment-action
        path: /douyin/comment/action
        methods: [POST]
        key-by: USER
        limit: 10
        window-seconds: 60
      - id: publish-action
        path: /douyin/publish/action
        methods: [POST]
        key-by: USER
        limit: 3
        window-seconds: 60
      - id: publish-upload-init
        path: /douyin/publish/upload/init
        methods: [POST]
        key-by: USER
        limit: 5
        window-seconds: 60
# logging
logging:
  level:
    org.springframework.cloud.gateway: trace
    reactor.netty.http.client: trace

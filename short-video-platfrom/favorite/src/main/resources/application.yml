server:
  port: 8004
  servlet:
    context-path: /douyin

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  application:
    name: ticktock-favorite
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://ticktock-db:3306/camps_tiktok?useSSL=false&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true
    username: root
    password: root@2023
    hikari:
      connection-timeout: 30000
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 600000
      pool-name: DataSourceHikariCP
      max-lifetime: 18000000
      connection-test-query: SELECT 1
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        service: ${spring.application.name}
  redis:
    host: redis
    port: 6379
    database: 0
    timeout: 3000
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 50
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: like-aggregation-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

jwt:
  issuer: ticktock
  signed: VGlrVG9rCg==
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 604800000

mybatis:
  type-aliases-package: fun.witt.model
  mapper-locations: classpath:mapper/*.xml

mapper:
  mappers: fun.witt.utils.MyMapper
  not-empty: false
  identity: MYSQL

favorite:
  outbox:
    publisher:
      fixed-delay-ms: 1000
      batch-size: 100
      max-retry: 6
      send-timeout-ms: 5000
      inflight-timeout-ms: 300000
  consumer:
    max-retry: 3

logging:
  level:
    root: info
    fun.witt.mapper: debug

server:
  port: 8002
  servlet:
    context-path: /douyin

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  application:
    name: ticktock-relation
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://ticktock-db:3306/camps_tiktok?useSSL=false&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true
    username: root
    password: root@2023
    hikari:
      connection-timeout: 30000
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 600000
      pool-name: DataSourceHikariCP
      max-lifetime: 18000000
      connection-test-query: SELECT 1
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        service: ${spring.application.name}
  redis:
    host: redis
    port: 6379
    database: 0
    timeout: 3000
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: relation-outbox-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

canal:
  enabled: true
  host: canal-server
  port: 11111
  destination: example
  username: canal
  password: canal
  filter: camps_tiktok.t_outbox
  batch-size: 100
  interval-ms: 1000

relation:
  outbox:
    poller:
      enabled: false

jwt:
  issuer: ticktock
  signed: VGlrVG9rCg==
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 604800000

mybatis:
  type-aliases-package: fun.witt.model
  mapper-locations: classpath:mapper/*.xml

mapper:
  mappers: fun.witt.utils.MyMapper
  not-empty: false
  identity: MYSQL

logging:
  level:
    root: info

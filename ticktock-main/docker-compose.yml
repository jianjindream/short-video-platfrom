version: "3.8"
services:
  nacos:
    image: nacos/nacos-server:v2.0.3
    environment:
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - ticktock-net
  minio:
    image: minio/minio
    restart: on-failure
    environment:
      - MINIO_ACCESS_KEY=ticktock
      - MINIO_SECRET_KEY=ticktock@2023
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    entrypoint: sh
    command: -c 'mkdir -p /export/ticktock && minio server /export --console-address ":9001"'
    networks:
      - ticktock-net
  ticktock-db:
    image: mariadb:10.4
    restart: on-failure
    environment:
      - MYSQL_ROOT_PASSWORD=root@2023
    volumes:
      - ./deploy/mysql/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./deploy/mysql/initdb/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - ticktock-net
  canal-server:
    image: canal/canal-server:v1.1.8
    restart: on-failure
    depends_on:
      - ticktock-db
    ports:
      - "11111:11111"
    environment:
      - canal.instance.master.address=ticktock-db:3306
      - canal.instance.dbUsername=canal
      - canal.instance.dbPassword=canal
      - canal.instance.filter.regex=camps_tiktok.t_outbox
    networks:
      - ticktock-net
  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "6379:6379"
    networks:
      - ticktock-net
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    restart: on-failure
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ticktock-net
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    restart: on-failure
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - ticktock-net
  comment:
    build:
      context: comment
      dockerfile: Dockerfile
    image: comment:latest
    depends_on:
      - ticktock-db
      - nacos
      - redis
    networks:
      - ticktock-net
  favorite:
    build:
      context: favorite
      dockerfile: Dockerfile
    image: favorite:latest
    depends_on:
      - ticktock-db
      - nacos
      - redis
      - kafka
    networks:
      - ticktock-net
  relation:
    build:
      context: relation
      dockerfile: Dockerfile
    image: relation:latest
    depends_on:
      - ticktock-db
      - nacos
      - redis
      - kafka
      - canal-server
    networks:
      - ticktock-net
  user:
    build:
      context: user
      dockerfile: Dockerfile
    image: user:latest
    depends_on:
      - ticktock-db
      - nacos
      - redis
    networks:
      - ticktock-net
  video:
    build:
      context: video
      dockerfile: Dockerfile
    image: video:latest
    depends_on:
      - ticktock-db
      - nacos
      - redis
      - minio
    networks:
      - ticktock-net
  gateway:
    build:
      context: gateway
      dockerfile: Dockerfile
    image: gateway:latest
    ports:
      - "8008:8008"
    depends_on:
      - nacos
    networks:
      - ticktock-net
networks:
  ticktock-net:
